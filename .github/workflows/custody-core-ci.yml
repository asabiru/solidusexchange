name: Custody Core CI

on:
  pull_request:
    paths:
      - "packages/custody-core/**"
      - "Documentation/regulated-core/adr/0003-isolate-custody-signing-boundary.md"
      - "Documentation/regulated-core/decision-register.md"
      - ".github/workflows/custody-core-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/custody-core/**"
      - "Documentation/regulated-core/adr/0003-isolate-custody-signing-boundary.md"
      - "Documentation/regulated-core/decision-register.md"
      - ".github/workflows/custody-core-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/custody-core

    services:
      postgres:
        image: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_USER: custody_test
          POSTGRES_PASSWORD: custody_test
          POSTGRES_DB: custody_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U custody_test -d custody_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: packages/custody-core/package-lock.json

      - name: Install locked package
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Verify custody boundary
        run: npm run verify

      - name: Verify PostgreSQL custody migration sources
        run: bash tests/postgres-migration-source-catalog.sh

      - name: Verify PostgreSQL custody outbox
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-outbox.sh

      - name: Verify PostgreSQL custody catalog
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-catalog.sh

      - name: Verify PostgreSQL custody backup and restore
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-backup-restore.sh

      - name: Verify PostgreSQL custody runtime privileges
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-runtime-privileges.sh
