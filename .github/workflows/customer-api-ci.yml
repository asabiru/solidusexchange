name: Customer API CI

on:
  pull_request:
    paths:
      - "packages/customer-api/**"
      - "packages/api-contracts/**"
      - "Documentation/regulated-core/decision-register.md"
      - ".github/workflows/customer-api-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/customer-api/**"
      - "packages/api-contracts/**"
      - "Documentation/regulated-core/decision-register.md"
      - ".github/workflows/customer-api-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/customer-api

    services:
      postgres:
        image: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_USER: customer_api_test
          POSTGRES_PASSWORD: customer_api_test
          POSTGRES_DB: customer_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U customer_api_test -d customer_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: packages/customer-api/package-lock.json

      - name: Install locked package
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint sources
        run: npm run lint

      - name: Typecheck sources
        run: npm run typecheck

      - name: Verify runtime boundary and contract conformance
        run: npm test

      - name: Verify PostgreSQL migration source catalog and policy
        run: npm run verify:migrations

      - name: Verify PostgreSQL store contract
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-store.sh
