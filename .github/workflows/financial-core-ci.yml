name: Financial Core CI

on:
  pull_request:
    paths:
      - "packages/financial-core/**"
      - "Documentation/regulated-core/finance-ledger-approval-pack.md"
      - "Documentation/regulated-core/adr/0002-ledger-is-financial-source-of-truth.md"
      - "Documentation/regulated-core/decision-register.md"
      - ".github/workflows/financial-core-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/financial-core/**"
      - "Documentation/regulated-core/finance-ledger-approval-pack.md"
      - "Documentation/regulated-core/adr/0002-ledger-is-financial-source-of-truth.md"
      - "Documentation/regulated-core/decision-register.md"
      - ".github/workflows/financial-core-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/financial-core

    services:
      postgres:
        image: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_USER: ledger_test
          POSTGRES_PASSWORD: ledger_test
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger_test -d ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: packages/financial-core/package-lock.json

      - name: Install locked package
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Verify reference posting boundary
        run: npm run verify

      - name: Verify PostgreSQL migration source catalog
        run: bash tests/postgres-migration-source-catalog.sh

      - name: Verify PostgreSQL migration source policy
        run: bash tests/postgres-migration-source-policy.sh

      - name: Apply PostgreSQL migrations
        run: |
          for migration in migrations/*.sql; do
            docker run --rm --network host \
              -e PGPASSWORD=ledger_test \
              -v "$PWD:/workspace:ro" -w /workspace \
              postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297 \
              psql -h 127.0.0.1 -U ledger_test -d ledger_test \
              -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify PostgreSQL migration history, rollback, order and sequence guard
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-migration-history.sh

      - name: Verify PostgreSQL chart definitions
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-chart-of-accounts.sh

      - name: Verify PostgreSQL owner truncate guard
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-owner-truncate-guard.sh

      - name: Verify PostgreSQL immutability trigger catalog
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-immutability-catalog.sh

      - name: Verify PostgreSQL trigger-function catalog
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-trigger-function-catalog.sh

      - name: Verify PostgreSQL trigger, rule and shadow-object surface
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-execution-surface-catalog.sh

      - name: Verify PostgreSQL posting-rule registry
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-posting-rule-registry.sh

      - name: Verify accepted balanced journal
        run: >-
          docker run --rm --network host
          -e PGPASSWORD=ledger_test
          -v "$PWD:/workspace:ro" -w /workspace
          postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
          psql -h 127.0.0.1 -U ledger_test -d ledger_test
          -v ON_ERROR_STOP=1
          -v "command_vector_json=$(tr -d '\n' < tests/command-digest-vector.json)"
          -f tests/postgres-smoke.sql

      - name: Verify PostgreSQL acceptance timeline
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-acceptance-artifact-integrity.sh

      - name: Reject non-finite PostgreSQL timestamps
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-finite-timestamps.sh

      - name: Verify PostgreSQL constraint catalog
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-constraint-catalog.sh

      - name: Verify PostgreSQL relation and column catalog
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-relation-catalog.sh

      - name: Verify PostgreSQL access-control catalog
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-access-control-catalog.sh

      - name: Verify PostgreSQL invariant triggers in replica mode
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-invariant-trigger-catalog.sh

      - name: Verify PostgreSQL reference integrity in replica mode
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-replica-reference-integrity.sh

      - name: Verify concurrent journal acceptance
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-concurrency.sh

      - name: Verify PostgreSQL backup scope, restore collision and recovery chain
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-backup-restore.sh

      - name: Verify runtime writer privileges and exact privilege catalog
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-runtime-privileges.sh

      - name: Verify accepted precision boundary
        run: >-
          docker run --rm --network host
          -e PGPASSWORD=ledger_test
          -v "$PWD:/workspace:ro" -w /workspace
          postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
          psql -h 127.0.0.1 -U ledger_test -d ledger_test
          -v ON_ERROR_STOP=1 -f tests/postgres-precision-boundary.sql

      - name: Verify rejected PostgreSQL boundaries
        run: |
          while IFS='|' read -r fixture expected; do
            set +e
            output="$(docker run --rm --network host \
              -e PGPASSWORD=ledger_test \
              -v "$PWD:/workspace:ro" -w /workspace \
              postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297 \
              psql -h 127.0.0.1 -U ledger_test -d ledger_test \
              -v ON_ERROR_STOP=1 -f "$fixture" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              echo "$fixture unexpectedly committed."
              exit 1
            fi
            printf '%s\n' "$output" | grep -F "$expected"
          done <<'EOF'
          tests/postgres-reject-incomplete.sql|requires at least two entries
          tests/postgres-reject-unbalanced.sql|is not balanced per asset
          tests/postgres-reject-late-entry.sql|is sealed
          tests/postgres-reject-unregistered-rule.sql|ledger_journals_posting_rule_fk
          tests/postgres-reject-rule-actor.sql|actor is not permitted by its posting rule
          tests/postgres-reject-rule-pattern.sql|entries violate its posting rule
          tests/postgres-reject-precision.sql|amount exceeds ledger precision limit
          tests/postgres-reject-nonfinite.sql|amount must be finite
          EOF

      - name: Verify persisted PostgreSQL ledger journal integrity
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-ledger-integrity.sh

      - name: Reject reused PostgreSQL command digests at write time
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-command-digest-uniqueness.sh
