name: Workflow Policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0

      - name: Test workflow policy
        run: node --test .github/scripts/check-workflow-policy.test.mjs

      - name: Enforce workflow policy
        run: node .github/scripts/check-workflow-policy.mjs

      - name: Test regulated-core approval-status policy
        run: node --test .github/scripts/check-regulated-core-status.test.mjs

      - name: Enforce regulated-core approval-status policy
        run: node .github/scripts/check-regulated-core-status.mjs

      - name: Test verification-integrity policy
        run: node --test .github/scripts/check-verification-integrity.test.mjs

      - name: Enforce verification-integrity policy
        run: node .github/scripts/check-verification-integrity.mjs
