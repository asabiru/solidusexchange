name: Matching Core CI

on:
  pull_request:
    paths:
      - "packages/matching-core/**"
      - "Documentation/regulated-core/decision-register.md"
      - ".github/workflows/matching-core-ci.yml"
  push:
    branches:
      - main
    paths:
      - "packages/matching-core/**"
      - "Documentation/regulated-core/decision-register.md"
      - ".github/workflows/matching-core-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/matching-core

    services:
      postgres:
        image: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_USER: matching_core_test
          POSTGRES_PASSWORD: matching_core_test
          POSTGRES_DB: matching_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matching_core_test -d matching_core_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: packages/matching-core/package-lock.json

      - name: Install locked package
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Verify engine boundary
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test engine and verifiers
        run: npm test

      - name: Verify PostgreSQL migration source catalog and policy
        run: npm run verify:migrations

      - name: Verify PostgreSQL journal contract
        env:
          PSQL_DOCKER_IMAGE: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        run: bash tests/postgres-journal.sh

      - name: Build type declarations
        run: npm run build
