# Dev-only audit database access policy (synthetic data only).
# Unix socket inside the database container: peer authentication only.
local   all                 all                                  peer
# The backoffice BFF shares the loopback interface and must use verified TLS.
hostssl solidchange_audit   backoffice_runtime   127.0.0.1/32    scram-sha-256
host    all                 all                  0.0.0.0/0       reject
host    all                 all                  ::/0            reject
