<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&amp;display=swap');
    </style>
    <!-- Subtle inner glow for dark bg -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2a1520" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f080c" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- Outer soft glow ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#D4B88A" stroke-width="0.5" opacity="0.4"/>

  <!-- Main circle — dark semi-transparent fill, gold border -->
  <circle cx="100" cy="100" r="93" fill="url(#bgGlow)" stroke="#D4B88A" stroke-width="1.6"/>

  <!-- S letter — bright champagne/gold for dark bg -->
  <text
    x="40"
    y="126"
    font-family="'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="98"
    font-weight="400"
    fill="#D8C090"
    letter-spacing="-2"
  >S</text>

  <!-- D letter — lighter rose-burgundy for dark bg -->
  <text
    x="70"
    y="164"
    font-family="'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="98"
    font-weight="400"
    fill="#9B3050"
    letter-spacing="-2"
  >D</text>
</svg>
