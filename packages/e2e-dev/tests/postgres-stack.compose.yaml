# Dev-only PostgreSQL service for the e2e postgres persistence arm
# (tests/postgres-stack.sh). The same pinned image the package-level
# postgres harnesses use; the script runs `docker compose up -d --wait`,
# applies both packages' migrations, exercises the assertions, and always
# finishes with `docker compose down -v`, so nothing persists between runs.
#
# The database holds both schemas in one instance — customer_api and
# matching_core never share tables, credentials stay the synthetic
# dev-only pair, and the port is published on a random loopback address
# discovered via `docker compose port`.
services:
  postgres:
    image: postgres:16.10-alpine3.22@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    user: "70:70"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    environment:
      POSTGRES_USER: solidchange_e2e_dev
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:-solidchange_e2e_dev}
      POSTGRES_DB: solidchange_e2e_dev
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /tmp:uid=70,gid=70,mode=0775
      - /var/run/postgresql:uid=70,gid=70,mode=0775
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--host=/var/run/postgresql",
          "--dbname=solidchange_e2e_dev",
          "--username=solidchange_e2e_dev"
        ]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 0s
