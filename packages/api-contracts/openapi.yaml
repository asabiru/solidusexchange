          "asset": {
            "$ref": "#/$defs/assetCode"
          },
          "comment": {
            "type": "string",
            "maxLength": 140
          }
        }
      },
      "CheckClaimRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "claim_reference"
        ],
        "properties": {
          "claim_reference": {
            "type": "string",
            "minLength": 16,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9._:-]+$"
          }
        }
      },
      "CheckPreview": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "check_type",
          "recipient_ref",
          "amount",
          "asset",
          "fee_amount",
          "preview_reference",
          "expires_at",
          "posting"
        ],
        "properties": {
          "check_type": {
            "const": "personal"
          },
          "recipient_ref": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "amount": {
            "$ref": "#/$defs/decimalAmount"
          },
          "asset": {
            "$ref": "#/$defs/assetCode"
          },
          "fee_amount": {
            "$ref": "#/$defs/decimalAmount"
          },
          "preview_reference": {
            "type": "string",
            "minLength": 16,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9._:-]+$"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "posting": {
            "const": "none"
          }
        }
      },
      "CheckView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "check_id",
          "check_type",
          "status",
          "sender_ref",
          "recipient_ref",
          "amount",
          "asset",
          "fee_amount",
          "outstanding_amount",
          "created_at",
          "expires_at",
          "resolved_at",
          "posting"
        ],
        "properties": {
          "check_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "check_type": {
            "const": "personal"
          },
          "status": {
            "type": "string",
            "enum": [
              "awaiting_confirmation",
              "created",
              "awaiting_recipient_kyc",
              "claimed",
              "cancelled",
              "expired"
            ]
          },
          "sender_ref": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "recipient_ref": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "amount": {
            "$ref": "#/$defs/decimalAmount"
          },
          "asset": {
            "$ref": "#/$defs/assetCode"
          },
          "fee_amount": {
            "$ref": "#/$defs/decimalAmount"
          },
          "outstanding_amount": {
            "$ref": "#/$defs/decimalAmount"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "resolved_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "posting": {
            "const": "none"
          }
        }
      },
      "Error": {
        "$ref": "./schemas/error.schema.json"
      }
