  "components": {
    "securitySchemes": {
      "CustomerBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OIDC access token",
        "description": "Future customer identity token. Production issuer remains approval-gated."
      },
      "OperatorBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OIDC access token",
        "description": "Separate staff identity token. It must never be accepted as a customer credential."
      }
    },
    "parameters": {
      "RequestId": {
        "name": "X-Request-Id",
        "in": "header",
        "required": true,
        "description": "Caller-generated UUIDv7 correlation identifier.",
        "schema": {
          "$ref": "#/components/schemas/UuidV7"
        }
      },
      "ClientVersion": {
        "name": "X-Client-Version",
        "in": "header",
        "required": true,
        "description": "Semantic or release version of the calling client.",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64
        }
      },
      "Platform": {
        "name": "X-Platform",
        "in": "header",
        "required": true,
        "description": "Calling application class.",
        "schema": {
          "type": "string",
          "enum": [
            "web",
            "ios",
            "android",
            "telegram-mini-app",
            "operator-web",
            "service"
          ]
        }
      },
      "DeviceId": {
        "name": "X-Device-Id",
        "in": "header",
        "required": true,
        "description": "Opaque random UUIDv4 operator workstation installation identifier. Required only for operator operations. It must not encode hardware identifiers, operator or customer PII, or provider data.",
        "schema": {
          "$ref": "#/components/schemas/DeviceId"
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Required for future command requests. The key is scoped to actor, operation and canonical payload digest.",
        "schema": {
          "$ref": "#/components/schemas/IdempotencyKey"
        }
      },
      "CheckId": {
        "name": "checkId",
        "in": "path",
        "required": true,
        "description": "Check identifier.",
        "schema": {
          "type": "string",
          "pattern": "^[a-z][a-z0-9_-]{2,127}$"
        }
      }
    },
    "headers": {
      "RequestId": {
        "required": true,
        "description": "Canonical request identifier echoed by the server.",
        "schema": {
          "$ref": "#/components/schemas/UuidV7"
        }
      },
      "RetryAfter": {
        "required": false,
        "description": "Seconds until the caller may retry.",
        "schema": {
          "type": "integer",
          "minimum": 1
        }
      }
    },
    "schemas": {
      "UuidV7": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      },
      "DeviceId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      },
      "IdempotencyKey": {
        "type": "string",
        "minLength": 16,
        "maxLength": 128,
        "pattern": "^[A-Za-z0-9._:-]+$"
      },
      "ApiMetadata": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "api_version",
          "contract_version",
          "runtime_boundary",
          "financial_commands_enabled",
          "production_providers_enabled"
        ],
        "properties": {
          "api_version": {
            "const": "v1"
          },
          "contract_version": {
            "type": "string",
            "const": "1.0.0-draft"
          },
          "runtime_boundary": {
            "const": "contract-only"
          },
          "financial_commands_enabled": {
            "const": false
          },
          "production_providers_enabled": {
            "const": false
          }
        }
      },
      "SessionView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "subject",
          "actor_type",
          "scopes",
          "expires_at"
        ],
        "properties": {
          "subject": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "actor_type": {
            "type": "string",
            "enum": [
              "customer",
              "operator",
              "service"
            ]
          },
          "scopes": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "CapabilitiesView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "capabilities",
          "commands_enabled"
        ],
        "properties": {
          "capabilities": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          },
          "commands_enabled": {
            "const": false
          }
        }
      },
      "WalletsView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "wallets"
        ],
        "properties": {
          "wallets": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/WalletView"
            }
          }
        }
      },
      "WalletView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "wallet_id",
          "asset",
          "available",
          "hold"
        ],
        "properties": {
          "wallet_id": {
            "type": "string",
            "pattern": "^syn_wal_[a-z0-9]{8,32}$"
          },
          "asset": {
            "$ref": "#/$defs/assetCode"
          },
          "available": {
            "$ref": "#/$defs/decimalAmount"
          },
          "hold": {
            "$ref": "#/$defs/decimalAmount"
          }
        }
      },
      "NotificationsView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mode",
          "delivery",
          "unread",
          "notifications"
        ],
        "properties": {
          "mode": {
            "const": "test"
          },
          "delivery": {
            "const": "disabled"
          },
          "unread": {
            "type": "integer",
            "minimum": 0
          },
          "notifications": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/NotificationView"
            }
          }
        }
      },
      "NotificationView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "notification_id",
          "created_at",
          "channel",
          "template",
          "locale",
          "text",
          "mode",
          "delivered",
          "read"
        ],
        "properties": {
          "notification_id": {
            "type": "string",
            "pattern": "^ntf_[0-9a-f]{24}$"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "channel": {
            "const": "telegram-draft"
          },
          "template": {
            "type": "string",
            "enum": [
              "session_login",
              "kyc_submitted",
              "kyc_in_review",
              "kyc_approved",
              "kyc_rejected",
              "kyc_needs_more_data",
              "kyc_timed_out",
              "kyc_unavailable",
              "support_received",
              "complaint_received"
            ]
          },
          "locale": {
            "const": "ru"
          },
          "text": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "mode": {
            "const": "test"
          },
          "delivered": {
            "const": false
          },
          "read": {
            "type": "boolean"
          }
        }
      },
      "KycStatusView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mode",
          "provider",
          "session_kyc",
          "status",
          "updated_at",
          "can_submit"
        ],
        "properties": {
          "mode": {
            "const": "test"
          },
          "provider": {
            "const": "simulator"
          },
          "session_kyc": {
            "type": "string",
            "enum": [
              "unverified",
              "pending",
              "verified"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "not_started",
              "submitted",
              "in_review",
              "approved",
              "rejected",
              "needs_more_data",
              "timed_out",
              "unavailable"
            ]
          },
          "application_id": {
            "type": "string",
            "pattern": "^kyc_[0-9a-f]{24}$"
          },
          "submitted_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "review_deadline": {
            "type": "string",
            "format": "date-time"
          },
          "reason_codes": {
            "type": "array",
            "uniqueItems": true,
            "maxItems": 2,
            "items": {
              "type": "string",
              "enum": [
                "SIM_DOCUMENT_UNREADABLE",
                "SIM_DATA_MISMATCH"
              ]
            }
          },
          "requested_items": {
            "type": "array",
            "uniqueItems": true,
            "maxItems": 2,
            "items": {
              "type": "string",
              "enum": [
                "proof_of_address",
                "selfie_retake"
              ]
            }
          },
          "can_submit": {
            "type": "boolean"
          }
        }
      },
      "ProfileView": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mode",
          "customer_ref",
          "display_name",
          "locale",
          "registered_at"
        ],
        "properties": {
          "mode": {
            "const": "test"
          },
          "customer_ref": {
            "type": "string",
            "pattern": "^SC-DEV-[0-9A-Z]{5}$"
          },
          "display_name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64,
            "pattern": "^Customer [0-9a-f]{8}$"
          },
          "locale": {
            "type": "string",
            "enum": [
              "en",
              "ky",
              "ru"
            ]
          },
          "registered_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "CheckPreviewRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "check_type",
          "recipient_ref",
          "amount",
          "asset"
        ],
        "properties": {
          "check_type": {
            "const": "personal"
          },
