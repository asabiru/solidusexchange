  "components": {
    "securitySchemes": {
      "CustomerBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OIDC access token",
        "description": "Future customer identity token. Production issuer remains approval-gated."
      },
      "OperatorBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "OIDC access token",
        "description": "Separate staff identity token. It must never be accepted as a customer credential."
      }
    },
    "parameters": {
      "RequestId": {
        "name": "X-Request-Id",
        "in": "header",
        "required": true,
        "description": "Caller-generated UUIDv7 correlation identifier.",
        "schema": {
          "$ref": "#/components/schemas/UuidV7"
        }
      },
      "ClientVersion": {
        "name": "X-Client-Version",
        "in": "header",
        "required": true,
        "description": "Semantic or release version of the calling client.",
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64
        }
      },
      "Platform": {
        "name": "X-Platform",
        "in": "header",
        "required": true,
        "description": "Calling application class.",
        "schema": {
          "type": "string",
          "enum": [
            "web",
            "ios",
            "android",
            "telegram-mini-app",
            "operator-web",
            "service"
          ]
        }
      },
      "DeviceId": {
        "name": "X-Device-Id",
        "in": "header",
        "required": true,
        "description": "Opaque random UUIDv4 operator workstation installation identifier. Required only for operator operations. It must not encode hardware identifiers, operator or customer PII, or provider data.",
        "schema": {
          "$ref": "#/components/schemas/DeviceId"
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Required for future command requests. The key is scoped to actor, operation and canonical payload digest.",
        "schema": {
          "$ref": "#/components/schemas/IdempotencyKey"
        }
      },
      "CheckId": {
        "name": "checkId",
        "in": "path",
        "required": true,
        "description": "Check identifier.",
        "schema": {
          "type": "string",
          "pattern": "^[a-z][a-z0-9_-]{2,127}$"
        }
      }
    },
    "headers": {
      "RequestId": {
        "required": true,
        "description": "Canonical request identifier echoed by the server.",
        "schema": {
          "$ref": "#/components/schemas/UuidV7"
        }
      },
      "RetryAfter": {
        "required": true,
        "description": "Seconds until the caller may retry.",
        "schema": {
          "type": "integer",
          "minimum": 1
        }
      }
    },
    "schemas": {
      "UuidV7": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      },
      "DeviceId": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      },
      "IdempotencyKey": {
        "type": "string",
        "minLength": 16,
        "maxLength": 128,
        "pattern": "^[A-Za-z0-9._:-]+$"
      },
      "ApiMetadata": {
        "type": "object",
        "additionalProperties": false,
        "required": [
